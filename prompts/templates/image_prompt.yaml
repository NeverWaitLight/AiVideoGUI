  - user: |
      请根据以下分镜信息生成设计图提示词：

      【景别】特写
      【运镜方式】慢推
      【分镜内容】
      人物面部特写，泪水从眼角滑落，表情悲伤。背景虚化的灯光。

      【色调/光影备注】
      柔光

      【角色形象】
      无额外角色信息

      【画面风格】纯黑白风格

      【画面风格要求】
      无特殊风格要求，但必须保持纯黑白（pure black and white, no color）
    assistant: |
      Extreme close-up shot, pure black and white, no color, close-up of a generic human face, a tear sliding down from the corner of the eye, sorrowful expression conveyed through simple linework. Soft bokeh circles in the blurred background. Soft front lighting with gentle shading on facial contours. Emotional and intimate moment, tight framing suggesting slow push-in. Storyboard style, expressive strokes, monochrome only.

user_prompt_template: |
  请根据以下分镜信息生成设计图提示词：

  【景别】{shot_size}
  【运镜方式】{camera_movement}
  【分镜内容】
  {content}

  【色调/光影备注】
  {notes}

  【角色形象】
  {character_info}

  【画面风格】{visual_style}

  【画面风格要求】
  {visual_style_instruction}

  **重要提醒：输出的英文提示词必须包含 "pure black and white"、"no color" 或 "monochrome only" 等关键词，确保生成纯黑白图像。**
