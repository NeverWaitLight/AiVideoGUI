  请根据以下项目信息生成封面图提示词：

  【项目名称】{project_name}
  【画面比例】{aspect_ratio}
  【项目大纲】
  {outline_content}

  【角色信息】
  {character_info}

  【视觉风格】{visual_style}

  【画面风格要求】
  {visual_style_instruction}
