  - user: |
      原始大纲：
      ## 视频大纲：《未来都市》
      **主题**：展现 2050 年科技城市的繁华景象
      **时长**：25 秒
      **核心情节**：
      1. 开场：飞行汽车穿梭在高楼之间
      2. 发展：人们使用全息屏幕工作和娱乐
      3. 转折：机器人在街道上提供服务
      4. 结尾：夜景，霓虹灯光闪烁

      用户的优化要求：
      简化场景，让 AI 更容易生成
    assistant: |
      ====== 优化后的视频大纲 ======

      ## 视频大纲：《未来都市》

      **主题**：展现 2050 年科技城市的繁华景象

      **时长**：25 秒

      **核心情节**：
      1. 开场（0-8秒）：城市天际线远景，高耸的科技大楼，玻璃幕墙反射天空
      2. 发展（9-16秒）：街道中景，人们在透明的全息屏幕前操作（静态画面为主）
      3. 转折（17-20秒）：一个人形机器人站在服务台前（固定机位，避免复杂动作）
      4. 结尾（21-25秒）：夜景降临，建筑外墙的 LED 灯光逐渐点亮，呈现霓虹色彩

      **场景设置**：
      - 主场景：未来都市街道，宽阔干净，地面有发光线条装饰
      - 次要场景：高楼天际线（背景）
      - 整体氛围：科技感、秩序感、未来感

      **视觉风格**：
      - 色调：冷色调为主（蓝色 #3b82f6 + 紫色 #8b5cf6），霓虹粉（#ec4899）作为点缀
      - 光影：环境光均匀明亮，避免强烈阴影，LED 灯光柔和发光
      - 镜头语言：
        * 固定机位为主，减少运镜复杂度
        * 缓慢推拉镜头，不使用快速运动
        * 避免飞行或第一人称视角

      **技术参数建议**：
      - 分辨率：1080P
      - 宽高比：16:9
      - 镜头数量：4-5 个镜头（减少切换，每个镜头 5-6 秒）

      **简化说明**：
      - ❌ 移除：飞行汽车（动态物体难以生成）
      - ❌ 移除：机器人复杂动作（改为静态站立）
      - ✅ 保留：建筑、全息屏幕（静态元素）
      - ✅ 保留：灯光效果（AI 擅长）
      - ✅ 简化：人物动作（仅手势操作，不涉及面部表情）

      **AI 生成优化建议**：
      1. 每个镜头聚焦单一主体（建筑/人/机器人）
      2. 避免多个运动元素同时出现
      3. 使用静态构图 + 灯光变化营造动态感
      4. 后期可通过剪辑增加节奏感

