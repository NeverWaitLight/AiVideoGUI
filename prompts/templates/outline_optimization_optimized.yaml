  - user: |
      原始大纲：
      ## 视频大纲：《晨跑》
      **主题**：清晨公园晨跑的活力场景
      **时长**：20 秒
      **核心情节**：
      1. 开场：日出时分，跑步者出现在公园小径
      2. 发展：沿着湖边奔跑，阳光洒在水面
      3. 结尾：停下来做拉伸，露出满足笑容

      用户的优化要求：
      时长延长到 40 秒，增加更多细节
    assistant: |
      ====== 优化后的视频大纲 ======

      ## 视频大纲：《晨跑》

      **主题**：清晨公园晨跑的活力场景

      **时长**：40 秒

      **核心情节**：
      1. 开场（0-8秒）：日出前的宁静，镜头从远景缓慢推进，跑步者的身影出现在公园入口
      2. 发展1（9-16秒）：跑步者沿着林荫小径奔跑，镜头跟随，树叶间透出晨光
      3. 发展2（17-24秒）：转入湖边步道，侧面跟拍，阳光洒在水面形成金色波光
      4. 转折（25-32秒）：遇到同样晨跑的其他人，互相点头致意，传递积极能量
      5. 高潮（33-36秒）：冲刺加速，配合音乐节奏，展现运动活力
      6. 结尾（37-40秒）：停下来做拉伸，深呼吸，露出满足笑容，远处太阳完全升起

      **场景设置**：
      - 主场景1：公园林荫小径，两侧是高大的梧桐树
      - 主场景2：湖边步道，一侧是开阔的湖面
      - 次要场景：公园入口、拉伸区（草坪）
      - 整体氛围：清新、活力、积极向上，从宁静过渡到充满能量

      **视觉风格**：
      - 色调：清晨暖色调，金黄色阳光（#fbbf24）+ 清新绿色植被（#10b981）
      - 光影：逆光拍摄为主，突出晨光穿透树叶和湖面反射，营造梦幻感
      - 镜头语言：
        * 开场：远景推镜头
        * 奔跑：侧面跟踪镜头 + 第一人称视角交替
        * 冲刺：快速剪辑 + 升格慢动作（0.5x）
        * 结尾：中景到特写，情绪收束

      **技术参数建议**：
      - 分辨率：1080P
      - 宽高比：16:9
      - 镜头数量：8-10 个镜头
      - 节奏：前段舒缓（清晨宁静），中段律动（奔跑节奏），后段放松（拉伸收尾）

      **新增细节说明**：
      - 环境音效：鸟鸣、脚步声、轻微喘息、湖水波动
      - 人物表情变化：从平静 → 专注 → 愉悦 → 满足
      - 互动元素：与其他跑者的点头致意，增加真实感和社群感

